[project]
name = "twitch-channel-points-miner"
version = "1.3.0"
description = "Automatically collects Twitch channel points"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "emoji==2.16.0",
    "flask>=3.1.3",
    "irc>=20.5.0",
    "millify>=0.1.1",
    "pandas==3.0.6",
    "pre-commit==4.6.2",
    "python-dateutil>=2.9.0.post0",
    "pytz==2026.5",
    "requests>=2.34.2",
    "validators>=0.35.0",
    "websocket-client==1.9.2",
    "werkzeug==3.1.9",
]

[dependency-groups]
dev = [
    "black==26.10.0",
    "pygments==2.21.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-s tests"
filterwarnings = [
    # Millify has some syntax warnings but still works
    'ignore::SyntaxWarning:.*millify.*'
]

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.uv]
# Exclude packages that are too new to help mitigate supply chain attacks
exclude-newer = "1 day"
